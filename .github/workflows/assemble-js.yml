name: Assemble Sidetrack JS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-js.yml'
      - 'assets/js-rest-*.txt'
      - 'assets/r*.hex'
      - 'assets/index-CwAHZJlY.js'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate v5 JS chunks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          prefix = Path('assets/index-CwAHZJlY.js').read_bytes()
          marker = b'return{filled:n,total:r}}'
          idx = prefix.find(marker)
          if idx < 0:
              raise SystemExit('prefix marker missing')
          prefix = prefix[:idx + len(marker)]
          rest0 = Path('assets/js-rest-0.txt').read_bytes().rstrip(b'\r\n')
          hexes = []
          for i in range(10):
              p = Path(f'assets/r{i}.hex')
              if not p.exists():
                  raise SystemExit(f'missing {p}')
              hexes.append(p.read_text().strip())
          tail = bytes.fromhex(''.join(hexes))
          full = prefix + rest0 + tail
          want_sha = 'c15c37724cc5f5eeb64aa8fafd5fc38ac8c00baebc0ea0e93d47fd1d2ce0eb15'
          want_size = 57768
          got_sha = hashlib.sha256(full).hexdigest()
          print('size', len(full), 'sha', got_sha)
          if len(full) != want_size or got_sha != want_sha:
              raise SystemExit(f'bundle mismatch size={len(full)} sha={got_sha}')
          Path('assets/index-CwAHZJlY.js').write_bytes(full)
          print('wrote complete index-CwAHZJlY.js')
          PY
      - name: Commit assembled bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-CwAHZJlY.js
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "Add complete Sidetrack v5 JS bundle"
          git push
