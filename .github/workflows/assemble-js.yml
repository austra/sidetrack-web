name: Assemble Sidetrack JS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-js.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch complete bundle
        run: |
          set -euo pipefail
          mkdir -p assets
          WANT_SHA=2942ae15caa66fd6503d8fa2a69f9ae23055aa9232c397df15d2b18c66a81fd1
          WANT_SIZE=48686
          ok=0
          for url in \
            "https://paste.rs/t8emk" \
            "https://h.uguu.se/oFLpQUqO.js" \
            "https://dpaste.com/9USTYWKYM.txt"
          do
            echo "trying $url"
            if curl -fsSL --retry 3 --max-time 30 -o /tmp/bundle.js "$url"; then
              got_size=$(stat -c%s /tmp/bundle.js)
              got_sha=$(sha256sum /tmp/bundle.js | awk '{print $1}')
              echo "size=$got_size sha=$got_sha"
              if [ "$got_size" = "$WANT_SIZE" ] && [ "$got_sha" = "$WANT_SHA" ]; then
                cp /tmp/bundle.js assets/index-aVU3gst9.js
                ok=1
                break
              fi
            fi
          done
          test "$ok" = 1
          stat -c%s assets/index-aVU3gst9.js
      - name: Commit assembled bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-aVU3gst9.js
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "Add complete Sidetrack JS bundle"
          git push
